name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y ripgrep shellcheck
      - name: Static tests
        run: bash tests/test-static.sh
      - name: ShellCheck
        run: shellcheck -x build.sh scripts/*.sh scripts/libs/*.sh tests/*.sh
